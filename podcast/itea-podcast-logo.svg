<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="ITEA Podcast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2748"/>
      <stop offset="1" stop-color="#143257"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8fd6"/>
      <stop offset="1" stop-color="#1f5fb0"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="600" height="600" rx="92" fill="url(#bg)"/>
  <rect x="8" y="8" width="584" height="584" rx="86" fill="none" stroke="#1f5fb0" stroke-opacity=".35" stroke-width="3"/>

  <!-- accent ring -->
  <circle cx="300" cy="248" r="150" fill="none" stroke="#1f5fb0" stroke-opacity=".25" stroke-width="2"/>

  <!-- waveform: equalizer bars = "the signal of expropriated work" -->
  <g fill="url(#wave)">
    <rect x="170" y="218" width="20" height="60"  rx="10"/>
    <rect x="204" y="188" width="20" height="120" rx="10"/>
    <rect x="238" y="148" width="20" height="200" rx="10"/>
    <rect x="272" y="118" width="20" height="260" rx="10"/>
    <rect x="306" y="148" width="20" height="200" rx="10"/>
    <rect x="340" y="178" width="20" height="140" rx="10"/>
    <rect x="374" y="206" width="20" height="84"  rx="10"/>
    <rect x="408" y="226" width="20" height="44"  rx="10"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="468" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="118" font-weight="800" letter-spacing="6" fill="#ffffff">ITEA</text>
  <text x="300" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="34" font-weight="700" letter-spacing="14" fill="#9fc1ea">PODCAST</text>
</svg>
