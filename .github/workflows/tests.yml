name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Fetch public inputs (O*NET 30.2, BLS crosswalks)
        # bls.gov occasionally refuses CI runners; the end-to-end test then skips
        run: itea fetch --dest data/external || echo "::warning::fetch failed; end-to-end reproduction test will be skipped"
      - name: Test
        run: pytest -v

  wheel:
    # checks that the packaged data travel with a plain `pip install`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the wheel outside the source tree
        run: |
          pip install build
          python -m build --wheel
          cd /tmp && python -m venv clean && clean/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Use packaged data
        run: |
          cd /tmp
          clean/bin/python -c "import itea, pandas as pd; a = itea.load_axi(itea.axi_path()); assert len(a) == 47810; assert len(itea.jrc_benchmark()) == 127"
          clean/bin/itea validate --index "$GITHUB_WORKSPACE"/v4.0/outputs/oaxi_eu.csv

  r-reference:
    # the Python port (itea.v3) must reproduce the R reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - name: Install
        run: pip install -e ".[test]"
      - name: R ↔ Python parity
        run: pytest -v tests/test_v3_r_parity.py
